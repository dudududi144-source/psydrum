<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSYDRUM — live demo + step sequencer</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      gap: 18px;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #2a1250, #0b0616 60%);
      color: #e8e2ff; padding: 28px;
    }
    h1 { font-weight: 800; letter-spacing: 0.04em; margin: 0; }
    h1 span { color: #b388ff; }
    .sub { opacity: 0.7; max-width: 680px; text-align: center; line-height: 1.45; margin: 0; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
    button.action {
      padding: 11px 18px; border-radius: 999px;
      border: 1px solid rgba(179,136,255,0.6);
      background: rgba(179,136,255,0.18); color: #e8e2ff;
      font-weight: 700; cursor: pointer;
    }
    button.action.primary { background: rgba(179,136,255,0.4); }
    label.ctl { display: flex; align-items: center; gap: 8px; font-size: 13px; opacity: 0.85; }
    input[type=range] { accent-color: #b388ff; }
    .seq { width: min(760px, 96vw); display: flex; flex-direction: column; gap: 4px; }
    .seqrow { display: grid; grid-template-columns: 74px repeat(16, 1fr); gap: 3px; align-items: center; }
    .seqrow .rlabel { font-size: 11px; opacity: 0.7; text-align: right; padding-right: 8px; }
    .cell {
      height: 26px; border-radius: 5px; cursor: pointer;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    }
    .cell:nth-child(4n+2) { background: rgba(255,255,255,0.09); } /* beat accents */
    .cell.on { background: rgba(179,136,255,0.6); border-color: rgba(179,136,255,0.9); }
    .cell.playhead { box-shadow: 0 0 0 2px rgba(255,255,255,0.55) inset; }
    .pads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: min(560px, 92vw); }
    .pad {
      padding: 18px 10px; border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05);
      color: #e8e2ff; font-size: 14px; font-weight: 600; cursor: pointer;
      user-select: none; text-align: center; transition: transform 60ms ease, background 60ms ease;
    }
    .pad small { display: block; font-weight: 400; opacity: 0.55; margin-top: 3px; }
    .pad.hit { transform: scale(0.96); background: rgba(179,136,255,0.28); }
    .mixer { display: grid; grid-template-columns: repeat(9, 1fr); gap: 8px; width: min(760px, 96vw); }
    .mstrip { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .mstrip .mlabel { font-size: 10px; opacity: 0.6; }
    .mstrip input[type=range] { writing-mode: vertical-lr; direction: rtl; height: 74px; width: 18px; }
    .note { opacity: 0.55; font-size: 13px; }
    a { color: #b388ff; }
  </style>
</head>
<body>
  <h1>PSY<span>DRUM</span></h1>
  <p class="sub">
    Analog-modeled drum device for the PSY family. Below: a 16-step sequencer (host-side WHAT)
    driving the device, plus live pads. Every drum has its own synthesis chain.
  </p>

  <div class="row">
    <button class="action primary" id="startBtn">▶ start audio</button>
    <button class="action" id="seqPlayBtn">⏵ play sequence</button>
    <label class="ctl">BPM <input type="range" id="bpmRange" min="90" max="160" value="138"><span id="bpmVal">138</span></label>
    <label class="ctl">swing <input type="range" id="swingRange" min="0" max="60" value="0"><span id="swingVal">0%</span></label>
    <label class="ctl">delay <input type="range" id="delaySendRange" min="0" max="100" value="0"><span id="delaySendVal">0%</span></label>
    <label class="ctl">reverb <input type="range" id="reverbSendRange" min="0" max="100" value="0"><span id="reverbSendVal">0%</span></label>
    <button class="action" id="clearBtn">clear</button>
    <button class="action" id="psyBtn">psy gallop preset</button>
    <button class="action" id="samplesBtn">samples: off</button>
    <button class="action" id="loadKitBtn">load kit JSON</button>
    <button class="action" id="exportKitBtn">export kit JSON</button>
    <input type="file" id="kitFileInput" accept=".json,application/json" style="display:none">
    <label class="ctl">kit <select id="kitSelect" style="background:rgba(255,255,255,0.06);color:#e8e2ff;border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:6px"></select></label>
  </div>

  <div class="seq" id="seq"></div>

  <div class="pads" id="pads"></div>

  <div class="mixer" id="mixer"></div>

  <p class="note">
    Source: <a href="https://github.com/dudududi144-source/psydrum">dudududi144-source/psydrum</a>
    · device = pure HOW (phases 0–11) · sequencer = host-side demo (phase 16 preview)
  </p>

  <script type="module">
    import { createDrumDevice, BUILTIN_KIT_MANIFEST, renderDrumSample, loadKitManifest } from './psydrum.js'

    const startBtn = document.getElementById('startBtn')
    const seqPlayBtn = document.getElementById('seqPlayBtn')
    const bpmRange = document.getElementById('bpmRange')
    const bpmVal = document.getElementById('bpmVal')
    const swingRange = document.getElementById('swingRange')
    const swingVal = document.getElementById('swingVal')
    const clearBtn = document.getElementById('clearBtn')
    const psyBtn = document.getElementById('psyBtn')
    const seqEl = document.getElementById('seq')
    const padsEl = document.getElementById('pads')

    // [label, midi note, channel]
    const DRUMS = [
      ['KICK', 36, 'kick'],
      ['SNARE', 38, 'snare'],
      ['CLAP', 39, 'clap'],
      ['HAT-C', 42, 'hat-closed'],
      ['HAT-O', 46, 'hat-open'],
      ['TOM', 45, 'tom'],
      ['CRASH', 49, 'crash'],
      ['RIDE', 51, 'ride'],
      ['PERC', 56, 'perc'],
    ]
    const STEPS = 16

    // pattern[row][step] = on/off
    const pattern = DRUMS.map(() => new Array(STEPS).fill(false))

    let ctx = null
    let device = null
    let bpm = 138
    let swing = 0
    let seqPlaying = false
    let seqStep = 0
    let seqNextTime = 0
    let seqTimer = null
    let playheadCells = []

    // ── build the 16-step grid ──
    function buildSeq() {
      seqEl.innerHTML = ''
      playheadCells = []
      for (let r = 0; r < DRUMS.length; r++) {
        const row = document.createElement('div')
        row.className = 'seqrow'
        const lab = document.createElement('div')
        lab.className = 'rlabel'
        lab.textContent = DRUMS[r][0]
        row.appendChild(lab)
        playheadCells.push([])
        for (let s = 0; s < STEPS; s++) {
          const cell = document.createElement('div')
          cell.className = 'cell' + (pattern[r][s] ? ' on' : '')
          cell.addEventListener('pointerdown', () => {
            pattern[r][s] = !pattern[r][s]
            cell.classList.toggle('on', pattern[r][s])
          })
          row.appendChild(cell)
          playheadCells[r].push(cell)
        }
        seqEl.appendChild(row)
      }
    }

    function setPlayhead(step) {
      for (let r = 0; r < DRUMS.length; r++) {
        for (let s = 0; s < STEPS; s++) {
          playheadCells[r][s].classList.toggle('playhead', s === step)
        }
      }
    }

    // ── live pads ──
    function buildPads() {
      padsEl.innerHTML = ''
      for (const [label, note, channel] of DRUMS) {
        const el = document.createElement('div')
        el.className = 'pad'
        el.innerHTML = label + '<small>' + channel + ' · ' + note + '</small>'
        el.addEventListener('pointerdown', () => {
          if (!device || !ctx) return
          device.onEvent({ type: 'note', note: note, velocity: 110, duration: 0.1, channel: channel, at: ctx.currentTime })
          el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 90)
        })
        padsEl.appendChild(el)
      }
    }

    // ── lookahead sequencer (host-side WHAT) ──
    function secondsPerStep() { return 60 / bpm / 4 }

    function scheduleStep(step, when) {
      for (let r = 0; r < DRUMS.length; r++) {
        if (pattern[r][step]) {
          const [, note, channel] = DRUMS[r]
          device.onEvent({ type: 'note', note: note, velocity: 112, duration: 0.1, channel: channel, at: when })
        }
      }
      // visual playhead (best-effort, main thread)
      const delayMs = Math.max(0, (when - ctx.currentTime) * 1000)
      setTimeout(() => setPlayhead(step), delayMs)
    }

    function scheduleAhead() {
      const LOOKAHEAD = 0.12
      while (seqNextTime < ctx.currentTime + LOOKAHEAD) {
        const sw = (seqStep % 2 === 1) ? (swing / 100) * secondsPerStep() * 0.5 : 0
        scheduleStep(seqStep, seqNextTime + sw)
        seqNextTime += secondsPerStep()
        seqStep = (seqStep + 1) % STEPS
      }
    }

    function startSeq() {
      if (!device || !ctx || seqPlaying) return
      seqPlaying = true
      seqStep = 0
      seqNextTime = ctx.currentTime + 0.06
      seqTimer = setInterval(scheduleAhead, 25)
      seqPlayBtn.textContent = '⏸ stop sequence'
    }

    function stopSeq() {
      seqPlaying = false
      if (seqTimer) clearInterval(seqTimer)
      seqTimer = null
      setPlayhead(-1)
      seqPlayBtn.textContent = '⏵ play sequence'
    }

    // ── psy gallop preset: driving 16th kick gallop + offbeat hats ──
    function psyGallop() {
      for (let r = 0; r < DRUMS.length; r++) pattern[r].fill(false)
      const kick = DRUMS.findIndex(d => d[2] === 'kick')
      const hatc = DRUMS.findIndex(d => d[2] === 'hat-closed')
      const clap = DRUMS.findIndex(d => d[2] === 'clap')
      // kick: 16th gallop (every step except a few) — classic psy driving
      for (let s = 0; s < STEPS; s++) pattern[kick][s] = (s % 4 !== 3)
      pattern[kick][0] = true
      // offbeat open-ish hats on the off-16ths
      for (let s = 2; s < STEPS; s += 4) pattern[hatc][s] = true
      // clap on beat 2 and 4 (steps 4 and 12)
      pattern[clap][4] = true; pattern[clap][12] = true
      refreshGrid()
    }

    function refreshGrid() {
      const rows = seqEl.querySelectorAll('.seqrow')
      rows.forEach((row, r) => {
        const cells = row.querySelectorAll('.cell')
        cells.forEach((cell, s) => cell.classList.toggle('on', pattern[r][s]))
      })
    }

    // ── start audio + device ──
    startBtn.addEventListener('click', async () => {
      if (device) return
      ctx = new AudioContext()
      await ctx.resume()
      const output = ctx.createGain()
      output.gain.value = 0.85
      output.connect(ctx.destination)
      device = createDrumDevice({ id: 'psydrum-demo', ctx: ctx, outputNode: output, optsSeed: 1, kitPatches: BUILTIN_KIT_MANIFEST.kits[0].drums }).device
      device.onStart()
      startBtn.textContent = '● running'
      startBtn.disabled = true
    })

    seqPlayBtn.addEventListener('click', () => { seqPlaying ? stopSeq() : startSeq() })
    bpmRange.addEventListener('input', () => { bpm = Number(bpmRange.value); bpmVal.textContent = bpmRange.value })
    swingRange.addEventListener('input', () => { swing = Number(swingRange.value); swingVal.textContent = swingRange.value + '%' })
    clearBtn.addEventListener('click', () => { for (let r = 0; r < DRUMS.length; r++) pattern[r].fill(false); refreshGrid() })
    psyBtn.addEventListener('click', psyGallop)

    // export the built-in kit manifest as a JSON template for custom kits
    const exportKitBtn = document.getElementById('exportKitBtn')
    exportKitBtn.addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(BUILTIN_KIT_MANIFEST, null, 2)], { type: 'application/json' })
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = 'psydrum-kit-manifest.json'
      a.click()
      setTimeout(() => URL.revokeObjectURL(url), 2000)
    })

    // load kit from a JSON file (validated by loadKitManifest, reject-at-load)
    const loadKitBtn = document.getElementById('loadKitBtn')
    const kitFileInput = document.getElementById('kitFileInput')
    loadKitBtn.addEventListener('click', () => kitFileInput.click())
    kitFileInput.addEventListener('change', async () => {
      const file = kitFileInput.files && kitFileInput.files[0]
      if (!file || !device) return
      try {
        const text = await file.text()
        const parsed = JSON.parse(text)
        const counters = { kitLoadErrors: 0 }
        const kits = loadKitManifest(parsed, counters)
        if (kits.length > 0) {
          device.loadKit(kits[0])
          loadKitBtn.textContent = 'kit: ' + kits[0].id
        } else {
          loadKitBtn.textContent = 'kit: invalid'
        }
      } catch (e) {
        loadKitBtn.textContent = 'kit: invalid'
      }
      kitFileInput.value = ''
    })

    // sample layer toggle: render procedural samples + attach to device
    let samplesOn = false
    let samplesLoaded = false
    const samplesBtn = document.getElementById('samplesBtn')
    samplesBtn.addEventListener('click', async () => {
      if (!device || !ctx) return
      samplesOn = !samplesOn
      if (samplesOn && !samplesLoaded) {
        samplesBtn.textContent = 'samples: loading…'
        for (const [label, note, channel] of DRUMS) {
          const dur = (channel === 'crash' || channel === 'ride') ? 0.5 : 0.25
          const buf = await renderDrumSample(channel, ctx.sampleRate, dur)
          device.setSample(channel, buf)
          device.enableSampleLayer(channel, 0.45) // blend sample under the synthesis
        }
        samplesLoaded = true
      }
      samplesBtn.textContent = 'samples: ' + (samplesOn ? 'on' : 'off')
    })

    // FX sends (step J): apply the same delay/reverb send level to all drums
    const delaySendRange = document.getElementById('delaySendRange')
    const delaySendVal = document.getElementById('delaySendVal')
    const reverbSendRange = document.getElementById('reverbSendRange')
    const reverbSendVal = document.getElementById('reverbSendVal')
    delaySendRange.addEventListener('input', () => {
      delaySendVal.textContent = delaySendRange.value + '%'
      if (device) for (const [, , channel] of DRUMS) device.setDrumDelaySend(channel, Number(delaySendRange.value) / 100)
    })
    reverbSendRange.addEventListener('input', () => {
      reverbSendVal.textContent = reverbSendRange.value + '%'
      if (device) for (const [, , channel] of DRUMS) device.setDrumReverbSend(channel, Number(reverbSendRange.value) / 100)
    })

    // mixer: one vertical level slider per drum
    const mixerEl = document.getElementById('mixer')
    DRUMS.forEach(([label, note, channel]) => {
      const strip = document.createElement('div')
      strip.className = 'mstrip'
      const lab = document.createElement('div')
      lab.className = 'mlabel'
      lab.textContent = label
      const rng = document.createElement('input')
      rng.type = 'range'
      rng.min = '0'; rng.max = '150'; rng.value = '100'
      rng.addEventListener('input', () => {
        if (device) device.setDrumLevel(channel, Number(rng.value) / 100)
      })
      strip.appendChild(lab)
      strip.appendChild(rng)
      mixerEl.appendChild(strip)
    })

    // populate kit selector from the built-in manifest
    const kitSelect = document.getElementById('kitSelect')
    BUILTIN_KIT_MANIFEST.kits.forEach((k, i) => {
      const opt = document.createElement('option')
      opt.value = String(i)
      opt.textContent = k.id + ' (' + k.style + ')'
      kitSelect.appendChild(opt)
    })
    kitSelect.addEventListener('change', () => {
      const idx = Number(kitSelect.value)
      const kit = BUILTIN_KIT_MANIFEST.kits[idx]
      if (device && kit) {
        device.loadKit(kit)
      }
    })

    buildSeq()
    buildPads()
    psyGallop() // start with a psy groove loaded
  </script>
</body>
</html>
