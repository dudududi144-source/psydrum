<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#12141a" />
<title>PSYDRUM Pro — Psytrance Drum Machine</title>
<meta name="theme-color" content="#12141a" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312141a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23b388ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23b388ff'/%3E%3C/svg%3E" />
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background:
    radial-gradient(1100px 500px at 15% -10%, rgba(96,60,180,0.16) 0%, transparent 60%),
    radial-gradient(900px 500px at 85% 110%, rgba(20,120,130,0.12) 0%, transparent 60%),
    linear-gradient(180deg,#0d0f14 0%,#08090d 100%);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:36px 16px;
}
.chassis {
  position:relative; width:min(1180px,100%);
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 3px),
    linear-gradient(180deg,#23262d 0%,#191c22 12%,#14161c 55%,#0f1116 100%);
  border-radius:16px; border:1px solid #000; padding:26px 48px 28px;
  box-shadow:0 40px 80px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.04) inset,0 2px 0 rgba(255,255,255,0.05) inset,0 -3px 0 rgba(0,0,0,0.6) inset;
}
.cheek { position:absolute; top:-7px; bottom:-7px; width:34px; border-radius:11px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,0.16) 0 2px, transparent 2px 6px),
    linear-gradient(90deg,#4d3117,#7a4f28 28%,#5d3c1c 72%,#3d2611);
  box-shadow:inset 0 2px 5px rgba(255,255,255,0.18),inset 0 -5px 10px rgba(0,0,0,0.55),0 14px 30px rgba(0,0,0,0.6); }
.cheek.l { left:-40px; } .cheek.r { right:-40px; }
.screw { position:absolute; width:15px; height:15px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#99a1ab,#3a3f46 70%,#22262b);
  box-shadow:0 1px 2px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.25); }
.screw.tl{top:10px;left:12px;} .screw.tr{top:10px;right:12px;} .screw.bl{bottom:10px;left:12px;} .screw.br{bottom:10px;right:12px;}
.brandbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.brand { display:flex; align-items:baseline; gap:12px; }
.brand .logo { font-size:24px; font-weight:800; letter-spacing:0.06em; color:#e8e2ff; }
.brand .logo span { color:#b388ff; }
.brand .sub { font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:#6b6f7a; }
.transport { display:flex; gap:10px; align-items:center; }
.tbtn { padding:9px 16px; border-radius:8px; border:1px solid #000; cursor:pointer; font-weight:700; font-size:13px;
  background:linear-gradient(180deg,#2c3038,#1b1e24); color:#cfd2d8;
  box-shadow:0 3px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08); }
.tbtn.primary { background:linear-gradient(180deg,#7c4dff,#5a2fd0); color:#fff; border-color:#3a1f8a; }
.tbtn.on { box-shadow:0 0 12px rgba(179,136,255,0.6), inset 0 1px 0 rgba(255,255,255,0.12); }
.tsel { background:#14161c; color:#cfd2d8; border:1px solid #000; border-radius:8px; padding:8px 10px; font-size:12px; }
.section { margin-top:18px; }
.section .stitle { font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:#6b6f7a; margin-bottom:10px; }
/* knob */
.kwrap { display:flex; flex-direction:column; align-items:center; gap:4px; }
.kzone { position:relative; cursor:ns-resize; }
.kzone svg { display:block; }
.kcap { position:absolute; left:50%; top:50%; width:54%; height:54%; transform:translate(-50%,-50%) rotate(var(--rot,0deg));
  border-radius:50%; background:radial-gradient(circle at 32% 26%,#565d66 0%,#2b2f36 46%,#1a1d22 78%,#101216 100%);
  box-shadow:0 4px 9px rgba(0,0,0,0.7),inset 0 1px 1px rgba(255,255,255,0.18),inset 0 -3px 6px rgba(0,0,0,0.6); }
.kptr { position:absolute; left:50%; top:7%; width:3px; height:32%; transform:translateX(-50%); background:var(--c,#b388ff); border-radius:2px; box-shadow:0 0 7px var(--c,#b388ff); }
.klabel { font-size:9px; letter-spacing:0.08em; text-transform:uppercase; color:#8a8e98; }
.kval { font-size:10px; color:#b388ff; font-weight:700; }
.krow { display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; }
/* sequencer grid */
.seqgrid { display:flex; flex-direction:column; gap:5px; }
.seqrow { display:grid; grid-template-columns:64px repeat(16,1fr); gap:4px; align-items:center; }
.rlabel { font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:#8a8e98; text-align:right; padding-right:8px; }
.step { height:26px; border-radius:4px; cursor:pointer; border:1px solid #000;
  background:linear-gradient(180deg,#20242b,#161920);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 2px rgba(0,0,0,0.4); }
.step:nth-child(4n+2) { background:linear-gradient(180deg,#262b33,#1a1e26); }
.step.on { background:linear-gradient(180deg,#8a5cf0,#6a3fd8); border-color:#4a2ba0; box-shadow:0 0 8px rgba(138,92,240,0.5), inset 0 1px 0 rgba(255,255,255,0.2); }
.step.ph { box-shadow:0 0 0 2px rgba(255,255,255,0.7) inset; }
.mixrow { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
.mixcell { display:flex; flex-direction:column; align-items:center; gap:3px; width:56px; }
.mixcell .mlabel { font-size:9px; letter-spacing:0.05em; text-transform:uppercase; color:#8a8e98; }
</style>
</head>
<body>
<div class="chassis">
  <div class="cheek l"></div><div class="cheek r"></div>
  <div class="screw tl"></div><div class="screw tr"></div><div class="screw bl"></div><div class="screw br"></div>

  <div class="brandbar">
    <div class="brand">
      <div class="logo">PSY<span>DRUM</span></div>
      <div class="sub">Psytrance Drum Machine · Pro</div>
    </div>
    <div class="transport">
      <button class="tbtn primary" id="startBtn">▶ RUN</button>
      <button class="tbtn" id="seqPlayBtn">⏵ SEQ</button>
      <select class="tsel" id="grooveSelect"></select>
      <select class="tsel" id="kitSelect"></select>
      <button class="tbtn" id="loadKitBtn">load kit</button>
      <button class="tbtn" id="exportKitBtn">export kit</button>
      <input type="file" id="kitFileInput" accept=".json,application/json" style="display:none">
      <button class="tbtn" id="samplesBtn">samples: off</button>
    </div>
  </div>

  <div class="section">
    <div class="stitle">Step Sequencer · 16 steps</div>
    <div class="seqgrid" id="seq"></div>
  </div>

  <div class="section">
    <div class="stitle">Master · Tempo & Feel</div>
    <div class="krow" id="masterKnobs"></div>
  </div>

  <div class="section">
    <div class="stitle">Mixer · Per-Drum Level / Delay / Reverb</div>
    <div class="mixrow" id="mixer"></div>
  </div>

  <div class="section">
    <div class="stitle">3D Spectrum</div>
    <canvas id="viz3d" width="1080" height="260" style="width:100%;border-radius:10px;background:linear-gradient(180deg,#0a0c10,#05060a);border:1px solid #000;box-shadow:inset 0 2px 8px rgba(0,0,0,0.6);"></canvas>
  </div>

  <div class="section">
    <div class="stitle">Song Mode · Chain grooves into a song</div>
    <div class="row" style="gap:8px;">
      <select class="tsel" id="songAddSelect"></select>
      <button class="tbtn" id="songAddBtn">+ add</button>
      <button class="tbtn" id="songClearBtn">clear</button>
      <button class="tbtn" id="songPlayBtn">⏵ play song</button>
    </div>
    <div id="songChain" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;"></div>
  </div>
</div>

<script type="module">
  import { createDrumDevice, BUILTIN_KIT_MANIFEST, renderDrumSample, renderPsyKickInto, renderSnareInto, renderHatInto, renderTomSamples, renderPercSamples, renderCymbalSamples, loadKitManifest, GROOVE_TEMPLATES, parsePattern, KIT_PRESETS, GROOVE_PRESETS, findGroovePreset, renderKickEngine, renderSnareEngine, renderHatEngine, renderCymbalEngine, kickParamsFromPatch, snareParamsFromPatch, hatParamsFromPatch, cymbalParamsFromPatch } from './psydrum.js'

  const DRUMS = [
    ['KICK',36,'kick'], ['SNARE',38,'snare'], ['CLAP',39,'clap'],
    ['HAT-C',42,'hat-closed'], ['HAT-O',46,'hat-open'], ['TOM',45,'tom'],
    ['CRASH',49,'crash'], ['RIDE',51,'ride'], ['PERC',56,'perc'],
  ]
  const STEPS = 16
  const pattern = DRUMS.map(() => new Array(STEPS).fill(false))

  // Real drum samples (commercial-quality, from psy5) mapped per channel.
  const REAL_SAMPLES = {
    'kick': './samples/real/909_BD_02.wav',
    'snare': './samples/real/md_snare_Snares_0000.wav',
    'clap': './samples/real/md_clap_Claps_0000.wav',
    'hat-closed': './samples/real/md_hat_Hats_0008.wav',
    'hat-open': './samples/real/md_hat_Hats_0013.wav',
    'perc': './samples/real/md_perc_Percs_0000.wav',
  }
  const realBuffers = {}   // channel -> AudioBuffer (loaded lazily)
  async function loadRealSample(channel){
    if(realBuffers[channel]) return realBuffers[channel]
    const url = REAL_SAMPLES[channel]
    if(!url) return null
    try{
      const resp = await fetch(url)
      const arr = await resp.arrayBuffer()
      const buf = await ctx.decodeAudioData(arr)
      realBuffers[channel] = buf
      return buf
    }catch(e){ return null }
  }
  // per-step retrigger/roll count (1-4), shift+click to cycle (market-leader ratcheting)
  const retrigger = DRUMS.map(() => new Array(STEPS).fill(1))

  let ctx=null, device=null
  let bpm=138, swing=0
  let seqPlaying=false, seqStep=0, seqNextTime=0, seqTimer=null
  let playheadCells=[]

  // ── SVG knob (port of PsySynthPro's Knob) ──
  function polarPt(cx,cy,r,a){const rad=a*Math.PI/180;return{x:cx+r*Math.sin(rad),y:cy-r*Math.cos(rad)}}
  function arcPath(cx,cy,r,a0,a1){const s=polarPt(cx,cy,r,a0),e=polarPt(cx,cy,r,a1);const large=(a1-a0)>180?1:0;
    return 'M '+s.x.toFixed(2)+' '+s.y.toFixed(2)+' A '+r+' '+r+' 0 '+large+' 1 '+e.x.toFixed(2)+' '+e.y.toFixed(2)}
  class Knob {
    constructor(host,cfg){
      this.cfg=cfg; this.min=cfg.min; this.max=cfg.max
      this.value=cfg.value!==undefined?cfg.value:cfg.def
      this.onChange=cfg.onChange||(()=>{})
      this.size=cfg.size||56
      this.el=document.createElement('div'); this.el.className='kwrap'; host.appendChild(this.el)
      this.build(); this.bind(); this.render()
    }
    build(){
      const s=this.size, NS='http://www.w3.org/2000/svg'
      this.zone=document.createElement('div'); this.zone.className='kzone'
      this.zone.style.width=s+'px'; this.zone.style.height=s+'px'
      const svg=document.createElementNS(NS,'svg'); svg.setAttribute('viewBox','0 0 100 100'); svg.setAttribute('width',s); svg.setAttribute('height',s)
      const ticks=document.createElementNS(NS,'g')
      for(let i=0;i<11;i++){const a=-135+(270*i)/10;const p1=polarPt(50,50,47,a),p2=polarPt(50,50,42,a)
        const ln=document.createElementNS(NS,'line');ln.setAttribute('x1',p1.x);ln.setAttribute('y1',p1.y)
        ln.setAttribute('x2',p2.x);ln.setAttribute('y2',p2.y);ln.setAttribute('stroke','#3a3f46');ln.setAttribute('stroke-width','2');ticks.appendChild(ln)}
      svg.appendChild(ticks)
      this.valueArc=document.createElementNS(NS,'path'); this.valueArc.setAttribute('fill','none')
      this.valueArc.setAttribute('stroke', this.cfg.color||'#b388ff'); this.valueArc.setAttribute('stroke-width','4'); this.valueArc.setAttribute('stroke-linecap','round')
      svg.appendChild(this.valueArc)
      this.zone.appendChild(svg)
      this.cap=document.createElement('div'); this.cap.className='kcap'
      this.ptr=document.createElement('div'); this.ptr.className='kptr'; this.ptr.style.setProperty('--c', this.cfg.color||'#b388ff')
      this.cap.appendChild(this.ptr); this.zone.appendChild(this.cap)
      this.el.appendChild(this.zone)
      const lab=document.createElement('div'); lab.className='klabel'; lab.textContent=this.cfg.label; this.el.appendChild(lab)
      this.valEl=document.createElement('div'); this.valEl.className='kval'; this.el.appendChild(this.valEl)
    }
    norm(){return (this.value-this.min)/(this.max-this.min)}
    bind(){
      const self=this; let dragging=false,startY=0,startV=0
      this.zone.addEventListener('pointerdown',e=>{dragging=true;startY=e.clientY;startV=self.value;self.zone.setPointerCapture(e.pointerId)})
      this.zone.addEventListener('pointermove',e=>{if(!dragging)return
        const dy=startY-e.clientY; const span=self.max-self.min
        self.set(startV+dy/150*span,true)})
      this.zone.addEventListener('pointerup',()=>{dragging=false})
      this.zone.addEventListener('wheel',e=>{e.preventDefault();const span=self.max-self.min
        self.set(self.value+(e.deltaY<0?1:-1)*span/50,true)},{passive:false})
      this.zone.addEventListener('dblclick',()=>{self.set(self.cfg.def!==undefined?self.cfg.def:self.min,true)})
    }
    set(v,silent){
      this.value=Math.min(this.max,Math.max(this.min,v)); this.render()
      if(!silent) this.onChange(this.value)
    }
    render(){
      const p=this.norm(); const a1=-135+270*p
      if(a1<=-133) this.valueArc.setAttribute('d','')
      else this.valueArc.setAttribute('d',arcPath(50,50,34,-135,a1))
      this.cap.style.setProperty('--rot',(-135+270*p)+'deg')
      this.valEl.textContent=this.cfg.fmt?this.cfg.fmt(this.value):String(Math.round(this.value))
    }
  }

  // ── sequencer grid ──
  const seqEl=document.getElementById('seq')
  function buildSeq(){
    seqEl.innerHTML=''; playheadCells=[]
    for(let r=0;r<DRUMS.length;r++){
      const row=document.createElement('div'); row.className='seqrow'
      const lab=document.createElement('div'); lab.className='rlabel'; lab.textContent=DRUMS[r][0]; row.appendChild(lab)
      playheadCells.push([])
      for(let s=0;s<STEPS;s++){
        const cell=document.createElement('div'); cell.className='step'+(pattern[r][s]?' on':'')
        cell.addEventListener('pointerdown',(e)=>{
          if(e.shiftKey){
            retrigger[r][s]=(retrigger[r][s]%4)+1
            cell.textContent=retrigger[r][s]>1?String(retrigger[r][s]):''
          }else{
            pattern[r][s]=!pattern[r][s]
            cell.classList.toggle('on',pattern[r][s])
          }
        })
        row.appendChild(cell); playheadCells[r].push(cell)
      }
      seqEl.appendChild(row)
    }
  }
  function setPlayhead(step){
    for(let r=0;r<DRUMS.length;r++) for(let s=0;s<STEPS;s++) playheadCells[r][s].classList.toggle('ph', s===step)
  }
  function refreshGrid(){
    const rows=seqEl.querySelectorAll('.seqrow')
    rows.forEach((row,r)=>{row.querySelectorAll('.step').forEach((cell,s)=>cell.classList.toggle('on',pattern[r][s]))})
  }

  // ── lookahead sequencer ──
  function secondsPerStep(){return 60/bpm/4}
  function scheduleStep(step,when){
    for(let r=0;r<DRUMS.length;r++) if(pattern[r][step]){
      const[,note,channel]=DRUMS[r]
      const rt=retrigger[r][step]
      const stepDur=secondsPerStep()
      for(let i=0;i<rt;i++){
        const hitTime=when+(i*stepDur/rt)
        device.onEvent({type:'note',note,velocity:112,duration:0.1,channel,at:hitTime})
      }
    }
    const delayMs=Math.max(0,(when-ctx.currentTime)*1000)
    setTimeout(()=>setPlayhead(step),delayMs)
  }
  function scheduleAhead(){
    while(seqNextTime<ctx.currentTime+0.12){
      const sw=(seqStep%2===1)?(swing/100)*secondsPerStep()*0.5:0
      scheduleStep(seqStep,seqNextTime+sw)
      if(window.__songTick)window.__songTick()
      seqNextTime+=secondsPerStep(); seqStep=(seqStep+1)%STEPS
    }
  }
  function startSeq(){if(!device||!ctx||seqPlaying)return
    seqPlaying=true;seqStep=0;seqNextTime=ctx.currentTime+0.06;seqTimer=setInterval(scheduleAhead,25)
    document.getElementById('seqPlayBtn').classList.add('on')}
  function stopSeq(){seqPlaying=false;if(seqTimer)clearInterval(seqTimer);seqTimer=null;setPlayhead(-1)
    document.getElementById('seqPlayBtn').classList.remove('on')}

  // ── start audio + device ──
  let analyser=null
  let drivePreGain=null
  document.getElementById('startBtn').addEventListener('click',async()=>{
    if(device)return
    ctx=new AudioContext(); await ctx.resume()
    const output=ctx.createGain(); output.gain.value=0.85
    // performance macro: global drive stage (PsySynthPro-style macro)
    drivePreGain=ctx.createGain(); drivePreGain.gain.value=1
    const driveShaper=ctx.createWaveShaper()
    const dc=new Float32Array(1024)
    for(let i=0;i<1024;i++){const x=(i/1023)*2-1;dc[i]=Math.tanh(x*2)/Math.tanh(2)}
    driveShaper.curve=dc
    const driveMakeup=ctx.createGain(); driveMakeup.gain.value=0.85
    analyser=ctx.createAnalyser(); analyser.fftSize=256
    output.connect(drivePreGain); drivePreGain.connect(driveShaper); driveShaper.connect(driveMakeup); driveMakeup.connect(analyser); analyser.connect(ctx.destination)
    device=createDrumDevice({id:'psydrum-demo',ctx,outputNode:output,optsSeed:1,kitPatches:BUILTIN_KIT_MANIFEST.kits[0].drums}).device
    device.onStart()
    document.getElementById('startBtn').classList.add('on')
  })
  document.getElementById('seqPlayBtn').addEventListener('click',()=>{seqPlaying?stopSeq():startSeq()})

  // ── master knobs (bpm, swing, delay send, reverb send) ──
  const masterKnobs=document.getElementById('masterKnobs')
  new Knob(masterKnobs,{label:'BPM',min:90,max:160,def:138,color:'#b388ff',onChange:v=>{bpm=v}})
  new Knob(masterKnobs,{label:'Swing',min:0,max:60,def:0,color:'#4dd0e1',fmt:v=>Math.round(v)+'%',onChange:v=>{swing=v}})
  new Knob(masterKnobs,{label:'Drive',min:0,max:100,def:0,color:'#ff7043',fmt:v=>Math.round(v)+'%',onChange:v=>{if(drivePreGain)drivePreGain.gain.value=1+v/100*6}})
  new Knob(masterKnobs,{label:'Delay',min:0,max:100,def:0,color:'#ffb74d',fmt:v=>Math.round(v)+'%',onChange:v=>{if(device)for(const[,,ch]of DRUMS)device.setDrumDelaySend(ch,v/100)}})
  new Knob(masterKnobs,{label:'Reverb',min:0,max:100,def:0,color:'#81c784',fmt:v=>Math.round(v)+'%',onChange:v=>{if(device)for(const[,,ch]of DRUMS)device.setDrumReverbSend(ch,v/100)}})

  // ── mixer: per-drum level knob ──
  const mixerEl=document.getElementById('mixer')
  DRUMS.forEach(([label,note,channel])=>{
    const cell=document.createElement('div'); cell.className='mixcell'; mixerEl.appendChild(cell)
    new Knob(cell,{label:label,min:0,max:150,def:100,size:48,color:'#b388ff',fmt:v=>Math.round(v)+'%',onChange:v=>{if(device)device.setDrumLevel(channel,v/100)}})
  })

  // ── groove selector ──
  const grooveSelect=document.getElementById('grooveSelect')
  GROOVE_PRESETS.forEach((g,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=g.label;grooveSelect.appendChild(o)})
  grooveSelect.addEventListener('change',()=>{
    const g=GROOVE_PRESETS[Number(grooveSelect.value)]; if(!g)return
    for(let r=0;r<DRUMS.length;r++)pattern[r].fill(false)
    for(const[label,note,channel]of DRUMS){const pat=g.patterns[channel];if(!pat)continue
      const ridx=DRUMS.findIndex(d=>d[2]===channel);const steps=parsePattern(pat)
      for(let s=0;s<steps.length;s++)pattern[ridx][s]=steps[s]}
    refreshGrid()
  })

  // ── kit selector ──
  const kitSelect=document.getElementById('kitSelect')
  KIT_PRESETS.forEach((k,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=k.label;kitSelect.appendChild(o)})
  // current kit patches drive the sample loader (kit -> engine params)
  let currentKitPatches=KIT_PRESETS[0].drums
  function currentSampleKit(){return KIT_PRESETS[Number(kitSelect.value)]||KIT_PRESETS[0]}
  kitSelect.addEventListener('change',()=>{
    const k=KIT_PRESETS[Number(kitSelect.value)]
    if(device&&k){
      device.loadKit({id:k.id,style:k.style,humanize:true,provenance:{license:'procedural',author:'psydrum',created:'2026'},choke:{hat:'exclusive',crashMaxPoly:2,rideMaxPoly:2},drums:k.drums})
      currentKitPatches=k.drums
      // re-render samples with the new kit so the sound actually changes
      if(samplesOn&&samplesLoaded){samplesLoaded=false;samplesOn=false;document.getElementById('samplesBtn').textContent='samples: off'}
    }
  })

  // ── kit load/export ──
  const loadKitBtn=document.getElementById('loadKitBtn'),kitFileInput=document.getElementById('kitFileInput')
  loadKitBtn.addEventListener('click',()=>kitFileInput.click())
  kitFileInput.addEventListener('change',async()=>{
    const file=kitFileInput.files&&kitFileInput.files[0]; if(!file||!device)return
    try{const text=await file.text();const parsed=JSON.parse(text)
      const counters={kitLoadErrors:0};const kits=loadKitManifest(parsed,counters)
      if(kits.length>0){device.loadKit(kits[0]);loadKitBtn.textContent=kits[0].id}else{loadKitBtn.textContent='invalid'}
    }catch(e){loadKitBtn.textContent='invalid'}
    kitFileInput.value=''
  })
  document.getElementById('exportKitBtn').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(BUILTIN_KIT_MANIFEST,null,2)],{type:'application/json'})
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='psydrum-kit-manifest.json';a.click()
    setTimeout(()=>URL.revokeObjectURL(url),2000)
  })

  // wrap a Float32Array into an AudioBuffer (for per-sample DSP renderers)
  // Load a real .wav sample (commercial sound from the psy5 bank). Returns the
  // decoded AudioBuffer, or null on failure (caller falls back to synthesis).
  async function loadRealSample(url){
    try{
      const resp=await fetch(url)
      if(!resp.ok)return null
      const ab=await resp.arrayBuffer()
      return await ctx.decodeAudioData(ab)
    }catch(e){return null}
  }

  function bufferFromSamples(ctx,data){
    const buf=ctx.createBuffer(1,data.length,ctx.sampleRate)
    buf.getChannelData(0).set(data)
    return buf
  }

  // ── samples toggle ──
  let samplesOn=false,samplesLoaded=false
  const samplesBtn=document.getElementById('samplesBtn')
  // map drum channel -> real sample file in public/samples/
  const REAL_SAMPLES={
    'kick':'samples/real/md_kick_Kicks_0000.wav',
    'snare':'samples/real/md_snare_Snares_0000.wav',
    'clap':'samples/real/md_clap_Claps_0000.wav',
    'hat-closed':'samples/real/md_hat_Hats_0008.wav',
    'hat-open':'samples/real/md_hat_Hats_0013.wav',
    'tom':'samples/tom.wav',
    'perc':'samples/real/md_perc_Percs_0000.wav',
    'ride':'samples/ride.wav',
    'crash':'samples/real/md_hat_Hats_0013.wav'
  }
  async function fetchSample(path){
    try{
      const resp=await fetch(path)
      if(!resp.ok)return null
      const ab=await resp.arrayBuffer()
      return await ctx.decodeAudioData(ab)
    }catch(e){return null}
  }
  samplesBtn.addEventListener('click',async()=>{
    if(!device||!ctx)return
    samplesOn=!samplesOn
    if(samplesOn&&!samplesLoaded){
      samplesBtn.textContent='samples: loading…'
      for(const[label,note,channel]of DRUMS){
        let buf=null
        // prefer the REAL sample; fall back to the synthesized engine
        const spath=REAL_SAMPLES[channel]
        if(spath){buf=await fetchSample(spath)}
        if(!buf){
          // fallback to synth engine
          let synthBuf
        // try the commercial-quality real sample first
        const realBuf = await loadRealSample(channel)
        if(realBuf){ buf=realBuf }
        else if(channel==='kick'){
          const kp=currentKitPatches['kick']||{}
          const kd=renderKickEngine(kickParamsFromPatch(kp,{sampleRate:ctx.sampleRate,durationSec:0.25,oversample:2}))
          buf=bufferFromSamples(ctx,kd)
        }else if(channel==='snare'){
          buf=await loadRealSample('samples/snare.wav')||bufferFromSamples(ctx,renderSnareEngine(snareParamsFromPatch(currentKitPatches['snare']||{},{sampleRate:ctx.sampleRate,durationSec:0.18,oversample:2})))
        }else if(channel==='hat-closed'){
          buf=await loadRealSample('samples/hat.wav')||bufferFromSamples(ctx,renderHatEngine(hatParamsFromPatch(currentKitPatches['hat-closed']||{},{sampleRate:ctx.sampleRate,durationSec:0.1,oversample:2},false)))
        }else if(channel==='hat-open'){
          buf=await loadRealSample('samples/hat.wav')||bufferFromSamples(ctx,renderHatEngine(hatParamsFromPatch(currentKitPatches['hat-open']||{},{sampleRate:ctx.sampleRate,durationSec:0.4,oversample:2},true)))
        }else if(channel==='tom'){
          const tp=currentKitPatches['tom']||{}
          const tk=kickParamsFromPatch(tp,{sampleRate:ctx.sampleRate,durationSec:0.25,oversample:2})
          tk.bodyStartHz=Math.max(tk.bodyStartHz,200);tk.clickAmount=0
          const td=renderKickEngine(tk)
          buf=bufferFromSamples(ctx,td)
        }else if(channel==='perc'){
          buf=await loadRealSample('samples/perc.wav')||bufferFromSamples(ctx,renderSnareEngine(snareParamsFromPatch(currentKitPatches['perc']||{},{sampleRate:ctx.sampleRate,durationSec:0.12,oversample:2})))
        }else if(channel==='crash'){
          const cp=currentKitPatches['crash']||{}
          const cd=renderCymbalEngine(cymbalParamsFromPatch(cp,{sampleRate:ctx.sampleRate,durationSec:0.7,oversample:2},false))
          buf=bufferFromSamples(ctx,cd)
        }else if(channel==='ride'){
          const rp=currentKitPatches['ride']||{}
          const rd=renderCymbalEngine(cymbalParamsFromPatch(rp,{sampleRate:ctx.sampleRate,durationSec:0.5,oversample:2},true))
          buf=bufferFromSamples(ctx,rd)
        }else{
          const dur=0.25
          buf=await renderDrumSample(channel,ctx.sampleRate,dur)
        }
        device.setSample(channel,buf); device.enableSampleLayer(channel,0.45)
      }
      samplesLoaded=true
    }
    samplesBtn.textContent='samples: '+(samplesOn?'on':'off')
  })

  buildSeq()
  // default groove
  grooveSelect.value='0'; grooveSelect.dispatchEvent(new Event('change'))

  // ── 3D spectrum (waterfall with perspective, PsySynthPro-style) ──
  const viz3d=document.getElementById('viz3d')
  const vctx=viz3d.getContext('2d')
  const VROWS=48          // history rows
  const VBINS=64          // frequency bins shown
  const hist=[]
  function hueFor(v){ return 275 - v*220 }   // violet(low) -> cyan/white(high)
  function drawViz3d(){
    if(analyser){
      const fd=new Uint8Array(analyser.frequencyBinCount)
      analyser.getByteFrequencyData(fd)
      const row=[]
      for(let b=0;b<VBINS;b++){
        const idx=Math.floor(b/VBINS*fd.length*0.7)
        row.push(fd[idx]/255)
      }
      hist.unshift(row)
      if(hist.length>VROWS)hist.pop()
    }else if(hist.length===0){
      hist.unshift(new Array(VBINS).fill(0))
      if(hist.length>VROWS)hist.pop()
    }
    const W=viz3d.width,H=viz3d.height
    vctx.clearRect(0,0,W,H)
    // draw history rows back-to-front with perspective
    for(let r=hist.length-1;r>=0;r--){
      const row=hist[r]
      const depth=r/VROWS                      // 0 = front, 1 = back
      const persp=1-depth*0.62                 // shrink with depth
      const rowW=W*persp
      const x0=(W-rowW)/2
      const y=H-14-depth*(H-40)                // back rows higher up
      const binW=rowW/VBINS
      const rowAlpha=(1-depth)*0.9+0.08
      for(let b=0;b<VBINS;b++){
        const v=row[b]
        const barH=Math.max(1,v*46*persp)
        const hue=hueFor(v)
        vctx.fillStyle='hsla('+hue+',85%,'+(45+v*35)+'%,'+rowAlpha+')'
        vctx.fillRect(x0+b*binW,y-barH,Math.max(0.5,binW-0.6),barH)
      }
    }
    requestAnimationFrame(drawViz3d)
  }
  drawViz3d()

  // ── song mode: chain grooves into a song ──
  const songChain=[]
  const songAddSelect=document.getElementById('songAddSelect')
  GROOVE_PRESETS.forEach((g,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=g.label;songAddSelect.appendChild(o)})
  const songChainEl=document.getElementById('songChain')
  function renderSongChain(){
    songChainEl.innerHTML=''
    songChain.forEach((gi,idx)=>{
      const chip=document.createElement('div')
      chip.style.cssText='background:rgba(179,136,255,0.15);border:1px solid rgba(179,136,255,0.4);border-radius:6px;padding:4px 10px;font-size:11px;color:#e8e2ff;cursor:pointer;'
      chip.textContent=(idx+1)+'. '+GROOVE_PRESETS[gi].label
      chip.addEventListener('click',()=>{songChain.splice(idx,1);renderSongChain()})
      songChainEl.appendChild(chip)
    })
  }
  document.getElementById('songAddBtn').addEventListener('click',()=>{
    songChain.push(Number(songAddSelect.value));renderSongChain()
  })
  document.getElementById('songClearBtn').addEventListener('click',()=>{
    songChain.length=0;renderSongChain()
  })
  function applyGrooveToPattern(gi){
    const g=GROOVE_PRESETS[gi];if(!g)return
    for(let r=0;r<DRUMS.length;r++)pattern[r].fill(false)
    for(const[label,note,channel]of DRUMS){const pat=g.patterns[channel];if(!pat)continue
      const ridx=DRUMS.findIndex(d=>d[2]===channel);const steps=parsePattern(pat)
      for(let s=0;s<steps.length;s++)pattern[ridx][s]=steps[s]}
    refreshGrid()
  }
  let songPos=0,songStepCount=0,songPlaying=false
  const STEPS_PER_GROOVE=32 // 2 bars per groove
  document.getElementById('songPlayBtn').addEventListener('click',()=>{
    if(!device||!ctx||songChain.length===0)return
    if(songPlaying){songPlaying=false;stopSeq();document.getElementById('songPlayBtn').textContent='⏵ play song';return}
    songPlaying=true;songPos=0;songStepCount=0
    applyGrooveToPattern(songChain[0])
    startSeq()
    document.getElementById('songPlayBtn').textContent='⏸ stop song'
  })
  // step-accurate song advance: called once per scheduled step from scheduleAhead
  window.__songTick=function(){
    if(!songPlaying||!seqPlaying)return
    songStepCount++
    if(songStepCount>=STEPS_PER_GROOVE){
      songStepCount=0
      songPos++
      if(songPos>=songChain.length){songPos=0} // loop the song
      applyGrooveToPattern(songChain[songPos])
    }
  }

  // PWA: register the service worker for offline support
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(()=>{}) }
</script>
