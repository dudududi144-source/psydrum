<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#12141a" />
<title>PSYDRUM Pro — Psytrance Drum Machine</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312141a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23b388ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23b388ff'/%3E%3C/svg%3E" />
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background:
    radial-gradient(1100px 500px at 15% -10%, rgba(96,60,180,0.16) 0%, transparent 60%),
    radial-gradient(900px 500px at 85% 110%, rgba(20,120,130,0.12) 0%, transparent 60%),
    linear-gradient(180deg,#0d0f14 0%,#08090d 100%);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:36px 16px;
}
.chassis {
  position:relative; width:min(1180px,100%);
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 3px),
    linear-gradient(180deg,#23262d 0%,#191c22 12%,#14161c 55%,#0f1116 100%);
  border-radius:16px; border:1px solid #000; padding:26px 48px 28px;
  box-shadow:0 40px 80px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.04) inset,0 2px 0 rgba(255,255,255,0.05) inset,0 -3px 0 rgba(0,0,0,0.6) inset;
}
.cheek { position:absolute; top:-7px; bottom:-7px; width:34px; border-radius:11px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,0.16) 0 2px, transparent 2px 6px),
    linear-gradient(90deg,#4d3117,#7a4f28 28%,#5d3c1c 72%,#3d2611);
  box-shadow:inset 0 2px 5px rgba(255,255,255,0.18),inset 0 -5px 10px rgba(0,0,0,0.55),0 14px 30px rgba(0,0,0,0.6); }
.cheek.l { left:-40px; } .cheek.r { right:-40px; }
.screw { position:absolute; width:15px; height:15px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#99a1ab,#3a3f46 70%,#22262b);
  box-shadow:0 1px 2px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.25); }
.screw.tl{top:10px;left:12px;} .screw.tr{top:10px;right:12px;} .screw.bl{bottom:10px;left:12px;} .screw.br{bottom:10px;right:12px;}
.brandbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.brand { display:flex; align-items:baseline; gap:12px; }
.brand .logo { font-size:24px; font-weight:800; letter-spacing:0.06em; color:#e8e2ff; }
.brand .logo span { color:#b388ff; }
.brand .sub { font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:#6b6f7a; }
.transport { display:flex; gap:10px; align-items:center; }
.tbtn { padding:9px 16px; border-radius:8px; border:1px solid #000; cursor:pointer; font-weight:700; font-size:13px;
  background:linear-gradient(180deg,#2c3038,#1b1e24); color:#cfd2d8;
  box-shadow:0 3px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08); }
.tbtn.primary { background:linear-gradient(180deg,#7c4dff,#5a2fd0); color:#fff; border-color:#3a1f8a; }
.tbtn.on { box-shadow:0 0 12px rgba(179,136,255,0.6), inset 0 1px 0 rgba(255,255,255,0.12); }
.tsel { background:#14161c; color:#cfd2d8; border:1px solid #000; border-radius:8px; padding:8px 10px; font-size:12px; }
.section { margin-top:18px; }
.section .stitle { font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:#6b6f7a; margin-bottom:10px; }
/* knob */
.kwrap { display:flex; flex-direction:column; align-items:center; gap:4px; }
.kzone { position:relative; cursor:ns-resize; }
.kzone svg { display:block; }
.kcap { position:absolute; left:50%; top:50%; width:54%; height:54%; transform:translate(-50%,-50%) rotate(var(--rot,0deg));
  border-radius:50%; background:radial-gradient(circle at 32% 26%,#565d66 0%,#2b2f36 46%,#1a1d22 78%,#101216 100%);
  box-shadow:0 4px 9px rgba(0,0,0,0.7),inset 0 1px 1px rgba(255,255,255,0.18),inset 0 -3px 6px rgba(0,0,0,0.6); }
.kptr { position:absolute; left:50%; top:7%; width:3px; height:32%; transform:translateX(-50%); background:var(--c,#b388ff); border-radius:2px; box-shadow:0 0 7px var(--c,#b388ff); }
.klabel { font-size:9px; letter-spacing:0.08em; text-transform:uppercase; color:#8a8e98; }
.kval { font-size:10px; color:#b388ff; font-weight:700; }
.krow { display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; }
/* sequencer grid */
.seqgrid { display:flex; flex-direction:column; gap:5px; }
.seqrow { display:grid; grid-template-columns:64px repeat(16,1fr); gap:4px; align-items:center; }
.rlabel { font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:#8a8e98; text-align:right; padding-right:8px; }
.step { height:26px; border-radius:4px; cursor:pointer; border:1px solid #000;
  background:linear-gradient(180deg,#20242b,#161920);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 2px rgba(0,0,0,0.4); }
.step:nth-child(4n+2) { background:linear-gradient(180deg,#262b33,#1a1e26); }
.step.on { background:linear-gradient(180deg,#8a5cf0,#6a3fd8); border-color:#4a2ba0; box-shadow:0 0 8px rgba(138,92,240,0.5), inset 0 1px 0 rgba(255,255,255,0.2); }
.step.ph { box-shadow:0 0 0 2px rgba(255,255,255,0.7) inset; }
.mixrow { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
.mixcell { display:flex; flex-direction:column; align-items:center; gap:3px; width:56px; }
.mixcell .mlabel { font-size:9px; letter-spacing:0.05em; text-transform:uppercase; color:#8a8e98; }
</style>
</head>
<body>
